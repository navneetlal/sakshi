[workspace]
resolver = "3"
members = ["crates/*", "apps/sakshi-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/navneetlal/sakshi"
publish = false

[workspace.dependencies]
sakshi-asr = { path = "crates/sakshi-asr" }
sakshi-core = { path = "crates/sakshi-core" }
sakshi-media = { path = "crates/sakshi-media" }
sakshi-models = { path = "crates/sakshi-models" }
sakshi-pipeline = { path = "crates/sakshi-pipeline" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hex = "0.4.3"
# The blocking client runs its own tokio runtime; rustls keeps TLS in-process.
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
# Already in the tree through hf-hub; used directly for one API call it gets wrong.
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
