[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/sakshi-cli",
    "apps/sakshi-desktop/src-tauri",
    "apps/sakshi-mcp",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/navneetlal/sakshi"
publish = false

[workspace.dependencies]
sakshi-app = { path = "crates/sakshi-app" }
sakshi-asr = { path = "crates/sakshi-asr" }
sakshi-capture = { path = "crates/sakshi-capture" }
sakshi-core = { path = "crates/sakshi-core" }
sakshi-mcp = { path = "crates/sakshi-mcp" }
sakshi-media = { path = "crates/sakshi-media" }
sakshi-models = { path = "crates/sakshi-models" }
sakshi-pipeline = { path = "crates/sakshi-pipeline" }
sakshi-store = { path = "crates/sakshi-store" }

anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
getrandom = "0.4.3"
dirs = "7.0.0"
hex = "0.4.3"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
image_hasher = "3.1.1"
jiff = "0.2.38"
# The blocking client runs its own tokio runtime; rustls keeps TLS in-process.
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
# Already in the tree through hf-hub; used directly for one API call it gets wrong.
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rmcp = { version = "3.7.0", features = ["transport-io", "transport-streamable-http-server"] }
# Bundled SQLite: the same version (with FTS5) on every platform.
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"

# macOS capture: pure-Rust bindings to Apple frameworks (no build scripts).
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-avf-audio = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

# Desktop app. The asset protocol serves key frames and recordings to the UI.
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-build = "2.7.4"
tauri-plugin-opener = "2.7.2"

tokio ={ version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std"] }
uuid = { version = "1.29.0", features = ["v7"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
# Denied everywhere; only the macOS capture backend opts out, because the
# Apple frameworks it calls are only reachable through unsafe FFI.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
